name: Link check

on:
  schedule:
    - cron: "17 6 * * 1" # every Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links in the roadmap pages
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --accept 200,201,202,203,204,206,301,302,303,307,308,403,429
            --max-concurrency 8 --timeout 25 --retry-wait-time 3 --max-retries 2
            --exclude-path roadmaps/assets
            --exclude "^https?://(www\.)?youtube\.com/results"
            --exclude "^mailto:"
            index.html roadmaps/index.html data-analysis-roadmap/index.html frappe-roadmap/index.html
          fail: false
          output: lychee/out.md

      - name: Open an issue when links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken links found in the roadmap pages"
          content-filepath: ./lychee/out.md
          labels: links, automated
